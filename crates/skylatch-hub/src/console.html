<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Skylatch Hub</title>
<style>
:root {
  color-scheme: light dark;
  --canvas: #F6F5F0; --bar: #EFECE5; --surface: #FCFBF8; --ink: #1A1A18;
  --muted: #6B6A64; --grid: #D8D5CC; --hair: #DDDAD0; --accent: #2563EB;
  --accent-hover: #1D4ED8; --accent-soft: rgba(37, 99, 235, 0.08);
  --on-accent: #FFFFFF; --green: #16A34A; --danger: #DC2626; --wash: #E6E2D8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #131417; --bar: #1A1C21; --surface: #1D1F25; --ink: #E8E6DF;
    --muted: #8A8D96; --grid: #282B33; --hair: #2B2E36; --accent: #60A5FA;
    --accent-hover: #93C5FD; --accent-soft: rgba(96, 165, 250, 0.12);
    --on-accent: #0B1220; --green: #4ADE80; --danger: #F87171; --wash: #24262D;
  }
}
:root[data-theme="dark"] {
  --canvas: #131417; --bar: #1A1C21; --surface: #1D1F25; --ink: #E8E6DF;
  --muted: #8A8D96; --grid: #282B33; --hair: #2B2E36; --accent: #60A5FA;
  --accent-hover: #93C5FD; --accent-soft: rgba(96, 165, 250, 0.12);
  --on-accent: #0B1220; --green: #4ADE80; --danger: #F87171; --wash: #24262D;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background-color: var(--canvas);
  background-image: radial-gradient(var(--grid) 1.1px, transparent 1.1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
}
header {
  height: 52px; padding: 0 20px; background: var(--bar);
  border-bottom: 1px solid var(--hair);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand-group { display: flex; align-items: center; gap: 9px; }
.brand { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.pill {
  font: 500 11px/1 ui-monospace, "Cascadia Mono", Menlo, monospace;
  color: var(--muted); background: var(--surface); border: 1px solid var(--hair);
  border-radius: 999px; padding: 4px 9px;
}
main {
  flex: 1; width: 100%; max-width: 820px; margin: 0 auto;
  padding: 28px 20px 40px; display: flex; flex-direction: column;
}
.signin-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
.card {
  width: 100%; background: var(--surface); border: 1px solid var(--hair);
  border-radius: 10px; padding: 20px;
}
.signin-card { max-width: 360px; }
h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
form { display: grid; gap: 11px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
input, button {
  font: inherit; border-radius: 7px; border: 1px solid var(--hair);
  background: var(--canvas); color: var(--ink); padding: 7px 10px;
}
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
button {
  cursor: pointer; font-weight: 500; background: var(--surface);
  transition: background 120ms, border-color 120ms;
}
button:hover { background: var(--wash); border-color: var(--muted); }
button:disabled { opacity: .55; cursor: wait; }
.primary {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ghost { padding: 5px 9px; font-size: 12px; }
.danger { color: var(--danger); padding: 4px 9px; font-size: 12px; }
.danger:hover { border-color: var(--danger); }
.full { width: 100%; }
details { border-top: 1px solid var(--hair); margin-top: 14px; padding-top: 12px; }
summary { cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; }
summary:hover { color: var(--ink); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.bar h2 { margin: 0; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pair-box {
  background: var(--accent-soft); border: 1px dashed var(--accent);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
}
.pair-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.code {
  font: 600 26px/1.1 ui-monospace, "Cascadia Mono", Menlo, monospace;
  letter-spacing: 0.12em; color: var(--accent);
}
.cmd-row { display: flex; gap: 8px; margin-top: 10px; }
.command {
  flex: 1; min-width: 0;
  font: 12px/1.4 ui-monospace, "Cascadia Mono", Menlo, monospace;
}
.table-wrap {
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 10px; overflow: hidden;
}
table { width: 100%; border-collapse: collapse; text-align: left; }
th {
  font-size: 11px; font-weight: 500; color: var(--muted);
  background: var(--bar); padding: 8px 12px; border-bottom: 1px solid var(--hair);
}
td { padding: 10px 12px; border-top: 1px solid var(--hair); vertical-align: middle; }
tbody tr:first-child td { border-top: none; }
.dev-cell { display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.dev-name { font-weight: 500; }
.mono { font: 12px/1.3 ui-monospace, "Cascadia Mono", Menlo, monospace; color: var(--muted); }
.tag {
  display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 5px;
  border: 1px solid var(--hair); background: var(--canvas); color: var(--muted);
}
.empty {
  background: var(--surface); border: 1px dashed var(--hair); border-radius: 10px;
  padding: 28px 16px; text-align: center; color: var(--muted);
}
.error { margin: 12px 0 0; color: var(--danger); font-size: 12px; }
.error:empty { display: none; }
.muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand-group">
    <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="4" y="4" width="56" height="56" rx="14" fill="#1B1D22" stroke="#2E323B" stroke-width="2"/>
      <path fill="none" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M44 22V18A4 4 0 0 0 40 14H18A4 4 0 0 0 14 18V46A4 4 0 0 0 18 50H40A4 4 0 0 0 44 46V42"/>
      <rect x="25" y="27" width="25" height="10" rx="2.5" fill="#3B82F6"/>
      <rect x="22" y="21" width="7.5" height="22" rx="2.5" fill="#F4F2EC"/>
    </svg>
    <span class="brand">Skylatch Hub</span>
    <span class="pill" id="host-pill"></span>
  </div>
  <div class="actions">
    <button class="ghost" id="theme-btn" type="button">Theme</button>
    <button class="ghost" id="logout" type="button" hidden>Sign out</button>
  </div>
</header>
<main>
  <div class="signin-wrap" id="signin">
    <section class="card signin-card" aria-labelledby="signin-title">
      <h2 id="signin-title">Sign in</h2>
      <form id="credentials">
        <label>Username <input name="username" autocomplete="username" required maxlength="128"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
        <button class="primary full">Sign in</button>
      </form>
      <details>
        <summary>Use an account token</summary>
        <form id="token-form" style="margin-top:10px">
          <label>Account token <input type="password" name="token" autocomplete="off" required></label>
          <button class="full">Sign in with token</button>
        </form>
      </details>
      <p id="signin-err" class="error" role="alert"></p>
    </section>
  </div>
  <section id="devices" aria-labelledby="devices-title" hidden>
    <div class="bar">
      <h2 id="devices-title">Online devices</h2>
      <div class="actions">
        <button class="primary" id="add" type="button">+ Add Device</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <section class="pair-box" id="pairing" aria-labelledby="pairing-title" hidden>
      <div class="pair-top">
        <div>
          <span class="muted" id="pairing-title">Single-use pairing code (10 min)</span><br>
          <output class="code" id="code"></output>
        </div>
        <span class="muted" id="copy-state" role="status"></span>
      </div>
      <div class="cmd-row">
        <input class="command" id="command" aria-label="Device join command" readonly>
        <button class="primary" id="copy" type="button">Copy</button>
      </div>
      <div class="cmd-row">
        <input class="command" id="command-linux" aria-label="Linux headless install and join command" readonly>
        <button id="copy-linux" type="button">Copy Linux</button>
      </div>
    </section>
    <div class="empty" id="empty" hidden>No devices online. Click <strong>+ Add Device</strong> to enroll a workstation.</div>
    <div class="table-wrap" id="listing" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col">Device</th>
            <th scope="col">OS / Form</th>
            <th scope="col">Displays</th>
            <th scope="col">Room</th>
            <th scope="col">Access</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="message" class="error" role="alert"></p>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
$('host-pill').textContent = location.host || 'localhost';
$('theme-btn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === 'dark' ||
    (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'light' : 'dark';
});
let token = '';
let session = 0;
let pairingTimer;
const prefix = 'api/v1/';
function showErr(text) {
  const target = $('signin').hidden ? $('message') : $('signin-err');
  $('signin-err').textContent = '';
  $('message').textContent = '';
  target.textContent = text;
}
async function request(path, method = 'GET', body, bearer = token) {
  const headers = {};
  if (bearer) headers.Authorization = `Bearer ${bearer}`;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(prefix + path, {method, headers, body: JSON.stringify(body), cache: 'no-store', redirect: 'error'});
  if (res.status === 204) return;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
function clearPairing() {
  clearTimeout(pairingTimer);
  $('pairing').hidden = true;
  $('command').value = '';
  $('code').textContent = '';
  $('copy-state').textContent = '';
}
function draw(devices) {
  $('rows').replaceChildren();
  $('devices-title').textContent = `Online devices (${devices.length})`;
  $('empty').hidden = devices.length !== 0;
  $('listing').hidden = devices.length === 0;
  for (const device of devices) {
    const row = $('rows').insertRow();
    const cell = row.insertCell();
    const wrap = document.createElement('div');
    wrap.className = 'dev-cell';
    const dot = document.createElement('span');
    dot.className = 'dot';
    const col = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'dev-name';
    name.textContent = device.name;
    const id = document.createElement('div');
    id.className = 'mono';
    id.textContent = device.device_id;
    col.append(name, id);
    wrap.append(dot, col);
    cell.append(wrap);

    const osCell = row.insertCell();
    for (const label of [device.os, device.form_factor]) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      osCell.append(tag, ' ');
    }
    if (device.hardware_model) {
      const model = document.createElement('div');
      model.className = 'muted';
      model.textContent = device.hardware_model;
      osCell.append(model);
    }

    const monCell = row.insertCell();
    monCell.className = 'mono';
    const mons = Array.isArray(device.monitor_list) && device.monitor_list.length
      ? device.monitor_list.map(m => `${m.width}×${m.height}`).join(', ')
      : `${device.monitors}`;
    monCell.textContent = mons;

    row.insertCell().textContent = device.room || '—';

    const revoke = document.createElement('button');
    revoke.className = 'danger';
    revoke.textContent = 'Revoke';
    revoke.setAttribute('aria-label', `Revoke ${device.name}`);
    revoke.addEventListener('click', () => {
      if (!confirm(`Revoke the device token for ${device.name}?`)) return;
      act(revoke, async () => {
        await request(`devices/${encodeURIComponent(device.device_id)}/token`, 'DELETE');
        if (token) await refresh();
      });
    });
    row.insertCell().append(revoke);
  }
}
async function act(button, action) {
  const accountSession = session;
  button.disabled = true;
  showErr('');
  try { await action(); }
  catch (err) { if (accountSession === session) showErr(err.message); }
  finally { button.disabled = false; }
}
async function signin(value) {
  const {devices} = await request('devices?online_only=true', 'GET', undefined, value);
  token = value;
  session++;
  draw(devices);
  $('signin').hidden = true;
  $('devices').hidden = false;
  $('logout').hidden = false;
  $('add').focus();
}
$('credentials').addEventListener('submit', (event) => {
  event.preventDefault();
  const fields = event.currentTarget.elements;
  act(event.submitter, async () => {
    const login = request('login', 'POST', {username: fields.username.value, password: fields.password.value}, '');
    fields.password.value = '';
    await signin((await login).token);
  });
});
$('token-form').addEventListener('submit', (event) => {
  event.preventDefault();
  const field = event.currentTarget.elements.token;
  act(event.submitter, async () => { const value = field.value.trim(); field.value = ''; await signin(value); });
});
$('add').addEventListener('click', () => act($('add'), async () => {
  const accountSession = session;
  const result = await request('pairing-codes', 'POST');
  if (accountSession !== session) return;
  clearPairing();
  $('code').textContent = result.code;
  $('command').value = `skylatch-agent join "${location.origin}" --code ${result.code}`;
  $('command-linux').value = `curl -fsSL https://raw.githubusercontent.com/maxesisn/skylatch/main/packaging/install-host.sh | sudo sh -s -- --hub \"${location.origin}\" --code ${result.code} --virtual-desktop`;
  $('pairing').hidden = false;
  $('copy').focus();
  pairingTimer = setTimeout(clearPairing, result.expires_in_secs * 1000);
}));
for (const [button, field] of [['copy', 'command'], ['copy-linux', 'command-linux']]) {
  $(button).addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($(field).value); $('copy-state').textContent = 'Copied'; }
    catch (_) { $(field).focus(); $(field).select(); $('copy-state').textContent = 'Selected'; }
  });
}
async function refresh() {
  const accountSession = session;
  const {devices} = await request('devices?online_only=true');
  if (accountSession === session) draw(devices);
}
$('refresh').addEventListener('click', () => act($('refresh'), refresh));
$('logout').addEventListener('click', () => {
  token = '';
  session++;
  $('rows').replaceChildren();
  $('devices').hidden = true;
  $('logout').hidden = true;
  $('signin').hidden = false;
  showErr('');
  clearPairing();
  $('credentials').elements.username.focus();
});
</script>
</body>
</html>

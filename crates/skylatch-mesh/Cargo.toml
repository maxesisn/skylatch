[package]
name = "skylatch-mesh"
description = "EasyTier detection, managed TOML profiles, runtime status and service lifecycle for Skylatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# EasyTier is only driven through its TOML files, its `easytier-core` / `easytier-cli` processes
# and the operating system's service manager; no EasyTier code is linked.
[dependencies]
if-addrs = "0.15"
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
skylatch-proto.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
thiserror.workspace = true
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

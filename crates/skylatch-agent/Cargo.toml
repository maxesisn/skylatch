[package]
name = "skylatch-agent"
description = "Skylatch host agent: registers outbound with the hub and bridges NSL1 sessions to the local engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util = "0.3"
gethostname = "1"
if-addrs = "0.15"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
socket2 = "0.6"
skylatch-client-core = { path = "../skylatch-client-core" }
skylatch-proto.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[dev-dependencies]
skylatch-hub = { path = "../skylatch-hub" }

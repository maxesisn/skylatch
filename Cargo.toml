[workspace]
resolver = "2"
members = [
    "crates/skylatch-proto",
    "crates/skylatch-hub",
    "crates/skylatch-client-core",
    "crates/skylatch-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/maxesisn/skylatch"
publish = false

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
skylatch-proto = { path = "crates/skylatch-proto" }

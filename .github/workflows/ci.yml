name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  host-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx264-dev libopus-dev libpulse-dev libwebsockets-dev zlib1g-dev \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev libxrandr-dev libxtst-dev \
            libavcodec-dev libavutil-dev libswscale-dev
      - name: Install host build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf x264 opus libwebsockets openssl ffmpeg
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build the host engine
        run: make -C host
      - name: Run the host unit tests
        run: make -C host test

  host-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ffmpeg
      - name: Build the host engine
        run: make -C host
      - name: Check console-only startup
        run: host/skylatch-host-engine.exe --help
      - name: Run the host unit tests
        run: make -C host test

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p skylatch-client-core
      - name: Build the native client
        shell: cmd
        run: clients\windows\build.bat --skip-rust
      - name: Check console-only startup
        shell: cmd
        run: clients\windows\skylatch-client.exe --help

  macos-client:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p skylatch-client-core
      - name: Build the native client
        run: clients/macos/build.sh --skip-rust
      - name: Run the client unit tests
        run: swift test --package-path clients/macos
      - name: Check console-only startup
        run: clients/macos/skylatch-client --help
